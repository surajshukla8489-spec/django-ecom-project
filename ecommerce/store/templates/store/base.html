<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}My Shop{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="{% url 'home' %}">🛍️ My Shop</a>
    <div class="ms-auto d-flex align-items-center gap-2 flex-wrap">
      <a class="btn btn-outline-light btn-sm" href="{% url 'cart' %}">Cart ({{ cart_count }})</a>
      {% if user.is_authenticated %}
        {% if user.is_staff %}<a class="btn btn-warning btn-sm" href="{% url 'dashboard' %}">Dashboard</a>{% endif %}
        <a class="btn btn-outline-light btn-sm" href="{% url 'my_orders' %}">My Orders</a>
        <span class="text-light small">Hi, {{ user.username }}</span>
        <form method="post" action="{% url 'logout' %}" class="m-0">{% csrf_token %}
          <button class="btn btn-danger btn-sm">Logout</button>
        </form>
      {% else %}
        <a class="btn btn-light btn-sm" href="{% url 'login' %}">Login</a>
        <a class="btn btn-primary btn-sm" href="{% url 'register' %}">Register</a>
      {% endif %}
    </div>
  </div>
</nav>
<div class="container pb-5">
  {% for m in messages %}
    <div class="alert alert-{% if m.tags == 'error' %}danger{% else %}{{ m.tags|default:'info' }}{% endif %} alert-dismissible fade show">
      {{ m }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
  {% endfor %}
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
