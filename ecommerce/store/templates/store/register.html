{% extends 'store/base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5">
  <div class="card shadow-sm"><div class="card-body">
    <h3 class="mb-3">Register</h3>
    <form method="post">{% csrf_token %}
      {% for f in form %}
        <div class="mb-3"><label class="form-label">{{ f.label }}</label>{{ f }}
        {% for e in f.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}</div>
      {% endfor %}
      <button class="btn btn-primary w-100">Account banayein</button>
    </form>
    <p class="mt-3 mb-0 small">Pehle se account hai? <a href="{% url 'login' %}">Login</a></p>
  </div></div>
</div></div>
{% endblock %}
