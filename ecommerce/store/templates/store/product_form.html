{% extends 'store/dash_base.html' %}
{% block title %}Product Form{% endblock %}
{% block dash %}
<div class="row"><div class="col-md-7">
  <h3>{% if object %}Edit{% else %}Add{% endif %} Product</h3>
  <form method="post" enctype="multipart/form-data" class="card card-body shadow-sm">{% csrf_token %}
    {% for f in form %}
      <div class="mb-3"><label class="form-label">{{ f.label }}</label>{{ f }}
      {% for e in f.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}</div>
    {% endfor %}
    <div><button class="btn btn-primary">Save</button> <a href="{% url 'dash_products' %}" class="btn btn-outline-secondary">Cancel</a></div>
  </form>
</div></div>
{% endblock %}
